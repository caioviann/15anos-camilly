<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pagamento</title>
    <style>
      body { font-family: Inter, system-ui, Arial, sans-serif; margin:0; padding:2rem; background:#faf8fb; color:#2f2641 }
      .container { max-width:720px; margin:0 auto; background:#fff; padding:1.6rem; border-radius:12px; box-shadow:0 18px 45px rgba(121,82,140,0.08) }
      h1 { margin-top:0 }
      .qr { max-width:320px; width:100%; height:auto; display:block; margin:1rem auto }
      .pix-key { background:#f5eef6; padding:0.8rem; border-radius:8px; text-align:center; font-weight:700; word-break:break-all }
      .actions { display:flex; gap:0.75rem; justify-content:center; margin-top:1rem }
      .btn { padding:0.7rem 1.1rem; border-radius:8px; border:none; cursor:pointer; font-weight:700 }
      .btn-primary { background:rgba(180,60,100,0.9); color:#fff }
      .btn-ghost { background:transparent; color:#6f5f7b }
      .pix-key-box { margin-top:1.2rem; display:flex; flex-direction:column; gap:0.5rem; }
      .pix-key-box label { color:#6f5f7b; font-size:0.95rem; }
      .pix-code { width:100%; padding:0.8rem; border-radius:10px; border:1px solid #d8cfd9; background:#faf6fb; color:#2f2641; font-size:0.95rem; }
      .pix-code:focus { outline:none; border-color:rgba(180,60,100,0.9); }
      .note { color:#6f5f7b; text-align:center; margin-top:1rem }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Pagamento</h1>
      <div id="content">
        <p>Preparando...</p>
      </div>
      <div class="note">Feche esta aba após concluir o pagamento.</div>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      const method = params.get('method')
      const item = params.get('item')
      const price = params.get('price')
      const paymentUrl = params.get('paymentUrl')
      const pixKey = params.get('pixKey')
      const pixImage = params.get('pixImage')

      const content = document.getElementById('content')

      function escapeHtml(s){ return s ? s.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '' }

      if (method === 'card') {
        if (paymentUrl) {
          window.location.href = decodeURIComponent(paymentUrl)
        } else {
          content.innerHTML = `\n            <p>Nenhum link de pagamento fornecido para cartão.</p>\n            <p>Item: <strong>${escapeHtml(item)}</strong></p>\n          `
        }
      } else if (method === 'pix') {
        let html = `\n          <p>Pagamento via PIX</p>\n`
        if (item) html += `\n          <p>Item: <strong>${escapeHtml(item)}</strong></p>\n`
        if (price) html += `\n          <p>Valor: <strong>${escapeHtml(price)}</strong></p>\n`
        if (pixImage) {
          html += `\n            <img class=\"qr\" src=\"${escapeHtml(pixImage)}\" alt=\"QR code PIX\" />\n`
        }
        html += `\n          <div class=\"pix-key-box\">\n            <label for=\"pixCode\">Chave PIX</label>\n            <input id=\"pixCode\" class=\"pix-code\" readonly value=\"${escapeHtml(pixKey || '')}\" />\n          </div>\n          <div class=\"actions\">\n            <button class=\"btn btn-primary\" id=\"copyBtn\">Copiar código</button>\n            <button class=\"btn btn-ghost\" id=\"closeBtn\">Voltar</button>\n          </div>\n`
        content.innerHTML = html

        const copyBtn = document.getElementById('copyBtn')
        const pixCode = document.getElementById('pixCode')
        if (copyBtn && pixCode) {
          copyBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(pixCode.value)
              copyBtn.textContent = 'Copiado!'
            } catch (e) {
              alert('Não foi possível copiar. Copie manualmente: ' + pixCode.value)
            }
          })
        }
        const closeBtn = document.getElementById('closeBtn')
        if (closeBtn) closeBtn.addEventListener('click', () => window.history.back())
      } else {
        content.innerHTML = `<p>Método de pagamento não especificado.</p>`
      }
    </script>
  </body>
</html>
